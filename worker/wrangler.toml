name = "somnisignal-screening-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGIN = "https://smasifhossain.github.io"
TURNSTILE_EXPECTED_HOSTNAME = "smasifhossain.github.io"

[[vpc_networks]]
binding = "ML_ORIGIN"
tunnel_id = "3391ed93-e51e-472d-893f-121edef9a72e"
remote = true

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Add secrets with:
# npx wrangler secret put ML_API_TOKEN
# npx wrangler secret put TURNSTILE_SECRET
# npx wrangler secret put RATE_LIMIT_SALT
