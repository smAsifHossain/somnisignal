[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "somnisignal"
version = "1.0.0"
description = "Laptop-hosted sleep-apnea risk prediction from overnight ECG"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "S M Asif Hossain" },
]
dependencies = [
  "fastapi>=0.139,<1.0",
  "uvicorn[standard]>=0.51,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "numpy>=2.3,<3.0",
  "scipy>=1.16,<2.0",
  "onnxruntime>=1.18,<2.0",
  "wfdb>=4.3,<5.0",
  "pyedflib>=0.1.42,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9.0",
  "httpx>=0.28,<1.0",
  "scikit-learn>=1.7,<2.0",
  "joblib>=1.5,<2.0",
]
training = [
  "scikit-learn>=1.7,<2.0",
  "joblib>=1.5,<2.0",
]
cnn = [
  "onnx>=1.16,<2.0",
  "onnxscript>=0.5,<1.0",
  "scikit-learn>=1.7,<2.0",
  "joblib>=1.5,<2.0",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-q"
